<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 | Fahad Al-Mutairi</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden;background:#f3ede2;color:#1d2527;font-family:"IBM Plex Sans Arabic",sans-serif}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(50,39,28,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(50,39,28,.03) 1px,transparent 1px);background-size:28px 28px}
    .box{position:relative;width:min(680px,100%);padding:clamp(36px,8vw,82px);background:#fbf7ef;border:1px solid #cfc4b5;border-radius:8px 34px 12px 34px;box-shadow:14px 16px 0 #dfa72f;text-align:center;transform:rotate(-.6deg)}
    .code{font-family:"Fraunces",serif;font-size:clamp(100px,24vw,190px);font-weight:900;line-height:.75;color:#b84432;letter-spacing:-.08em}
    .note{position:absolute;top:24px;right:-28px;padding:12px 16px;background:#244d66;color:#fff8ed;font-family:"IBM Plex Mono",monospace;font-size:11px;transform:rotate(7deg);box-shadow:5px 6px 0 rgba(0,0,0,.15)}
    h1{margin:38px 0 8px;font-family:"Fraunces","IBM Plex Sans Arabic",serif;font-size:clamp(28px,5vw,44px)}
    p{max-width:470px;margin:0 auto 28px;color:#586061;line-height:1.9}
    a{display:inline-flex;align-items:center;gap:10px;min-height:50px;padding:10px 22px;border-radius:999px;background:#1d2527;color:#fbf7ef;text-decoration:none;font-weight:700;transition:.2s}
    a:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:5px 6px 0 #dfa72f}
    .domain{margin-top:28px;color:#867d72;font-family:"IBM Plex Mono",monospace;font-size:10px}
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <main class="box">
    <div class="note">ROW NOT FOUND</div>
    <div class="code">404</div>
    <h1>هذا الرقم ما طلع في التحليل.</h1>
    <p>الصفحة التي تبحث عنها انتقلت أو لم تعد موجودة. الأعمال والمشاريع ما زالت بانتظارك في الصفحة الرئيسية.</p>
    <a href="/">العودة للرئيسية <span>←</span></a>
    <div class="domain">fahadalmutairi.com</div>
  </main>
</body>
</html>
